# Tema da interface (streamlit run src/app.py, a partir da raiz).
# Claro e escuro: o modo segue o sistema e pode ser trocado em
# ⋮ → Settings → "Choose app theme".
# Identidade do relatório: títulos em Libertinus Serif (a Libertine do
# LaTeX) e texto em Libertinus Sans; cores das figuras (figuras.py):
# vermelho #c0392b = evasão, azul #2e6da4 = formatura, verde #27ae60,
# laranja #e67e22, violeta #8e6bb8.

[theme]
font = "'Libertinus Sans':https://fonts.googleapis.com/css2?family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&display=swap"
headingFont = "'Libertinus Serif':https://fonts.googleapis.com/css2?family=Libertinus+Serif:wght@400;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 16
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#24527A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#222222"
linkColor = "#24527A"
borderColor = "#E1E6EB"
codeBackgroundColor = "#F1F4F7"
codeTextColor = "#222222"
redColor = "#C0392B"
blueColor = "#2E6DA4"
greenColor = "#27AE60"
orangeColor = "#E67E22"
yellowColor = "#D9A520"
violetColor = "#8E6BB8"
grayColor = "#6B7785"
dataframeBorderColor = "#E1E6EB"
dataframeHeaderBackgroundColor = "#F4F6F8"

[theme.dark]
primaryColor = "#5E97D1"
backgroundColor = "#0F1419"
secondaryBackgroundColor = "#1A2129"
textColor = "#E6EAEE"
linkColor = "#8DB6E0"
borderColor = "#2A333C"
codeBackgroundColor = "#1A2129"
codeTextColor = "#E6EAEE"
redColor = "#E0675B"
blueColor = "#5E97D1"
greenColor = "#4CC383"
orangeColor = "#F0984A"
yellowColor = "#E8C04A"
violetColor = "#A88BD0"
grayColor = "#9AA5B1"
dataframeBorderColor = "#2A333C"
dataframeHeaderBackgroundColor = "#1A2129"
dataframeHeaderTextColor = "#E6EAEE"

[theme.light.sidebar]
backgroundColor = "#F7F9FA"
secondaryBackgroundColor = "#EEF2F5"
textColor = "#222222"
borderColor = "#E1E6EB"
primaryColor = "#24527A"

[theme.dark.sidebar]
backgroundColor = "#0B0F13"
secondaryBackgroundColor = "#1A2129"
textColor = "#E6EAEE"
borderColor = "#2A333C"
primaryColor = "#5E97D1"
